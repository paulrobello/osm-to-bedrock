# Pre-commit hooks for osm-to-bedrock
# Install: make install-hooks   (or: pre-commit install)
# Run manually: make pre-commit (or: pre-commit run --all-files)
# Bump hook revs: make pre-commit-update (or: pre-commit autoupdate)

repos:
  # Secret scanning — required before publishing (guide: git-ci.md).
  # Two complementary scanners: gitleaks (entropy + rules) catches leaked
  # tokens in the staged diff; detect-private-key catches SSH/PEM material.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Standard hygiene hooks (incl. detect-private-key).
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: mixed-line-ending
      - id: detect-private-key

  # Rust checks — wired to the Makefile's canonical targets so the hook never
  # re-declares an invocation the Makefile already owns. types: [rust] keeps
  # them from firing on non-Rust changes.
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt (make fmt)
        entry: make fmt
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy (make lint)
        entry: make lint
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-test
        name: cargo test (make test)
        entry: make test
        language: system
        types: [rust]
        pass_filenames: false
